<!doctype html>
<!-- X post image: the new tidy UI (one grouped menu), 1600x900. window.DESK / window.PHONE are
     screenshots of the live site with the menu open. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root { --ink: #fafafa; --ink-2: #a3a3a3; --ink-3: #6b6b6b; --line: rgba(255,255,255,0.14); --line-strong: rgba(255,255,255,0.34); }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #000; color: var(--ink); font-family: Geist, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .frame { position: relative; width: 1600px; height: 900px; overflow: hidden; background: radial-gradient(60% 80% at 75% 50%, #161616 0%, #050505 60%, #000 100%); }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 56px 56px; opacity: 0.2; mask-image: radial-gradient(70% 70% at 28% 45%, #000, transparent 75%); }
  .ticks::before, .ticks::after { content: ''; position: absolute; width: 20px; height: 20px; border: 0 solid var(--ink); z-index: 5; }
  .ticks::before { left: 28px; top: 28px; border-top-width: 3px; border-left-width: 3px; }
  .ticks::after { right: 28px; bottom: 28px; border-bottom-width: 3px; border-right-width: 3px; }

  .copy { position: absolute; left: 88px; top: 92px; width: 520px; display: grid; gap: 26px; z-index: 2; }
  .brand { display: flex; align-items: center; gap: 12px; font: 600 16px 'Geist Mono', monospace; letter-spacing: 0.22em; }
  .brand span { color: var(--ink-3); }
  .brand svg { width: 34px; height: 31px; }
  .new { justify-self: start; font: 600 14px 'Geist Mono', monospace; letter-spacing: 0.18em; background: var(--ink); color: #000; padding: 7px 12px; }
  h1 { margin: 0; font-size: 84px; line-height: 0.95; font-weight: 800; letter-spacing: -0.055em; }
  h1 span { color: var(--ink-3); }
  .burger { display: inline-grid; gap: 3px; width: 16px; margin-right: 10px; vertical-align: 1px; }
  .burger i { display: block; height: 2px; background: #000; }
  .points { display: grid; gap: 14px; margin: 6px 0 0; padding: 0; list-style: none; font-size: 21px; color: var(--ink-2); }
  .points li { display: flex; gap: 14px; align-items: baseline; }
  .points li::before { content: ''; flex: none; width: 9px; height: 9px; background: var(--ink); transform: translateY(-3px); }
  .url { position: absolute; left: 88px; bottom: 84px; display: flex; gap: 12px; align-items: center; font: 600 20px 'Geist Mono', monospace; z-index: 2; }
  .url b { background: var(--ink); color: #000; padding: 10px 16px; }
  .url i { font-style: normal; color: var(--ink-3); font-weight: 500; font-size: 16px; }

  .desk { position: absolute; left: 640px; top: 110px; width: 900px; border: 1px solid var(--line-strong); background: #000; box-shadow: 0 40px 140px rgba(0,0,0,0.95); }
  .desk .chrome { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 14px; border-bottom: 1px solid var(--line); font: 500 13px 'Geist Mono', monospace; color: var(--ink-2); }
  .desk .chrome em { width: 10px; height: 10px; border: 1px solid var(--line-strong); }
  .desk .chrome span { margin-left: 10px; }
  .desk img { display: block; width: 100%; }
  .phone { position: absolute; right: 70px; bottom: 46px; width: 262px; padding: 9px; border: 1px solid var(--line-strong); border-radius: 36px; background: #000; box-shadow: 0 30px 100px rgba(0,0,0,0.95), 0 0 0 6px #000; }
  .phone img { display: block; width: 100%; border-radius: 28px; }
  .tag { position: absolute; z-index: 4; font: 600 12px 'Geist Mono', monospace; letter-spacing: 0.14em; background: #000; border: 1px solid var(--line-strong); padding: 7px 10px; }
  .tag::before { content: ''; display: inline-block; width: 7px; height: 7px; background: var(--ink); margin-right: 8px; vertical-align: 1px; }
</style>
</head>
<body>
<div class="frame ticks">
  <div class="grid"></div>
  <div class="copy">
    <div class="brand"><svg viewBox="96 106 208 188"><g fill="#fff"><polygon points="100,290 138,290 230,124 230,110 200,110"/><polygon points="158.3,185 286,185 286,215 141.7,215"/><rect x="200" y="110" width="100" height="30"/><rect x="214" y="110" width="30" height="180"/><rect x="214" y="260" width="86" height="30"/></g></svg>AEON <span>NETWORK</span></div>
    <div class="new"><span class="burger" aria-hidden="true"><i></i><i></i><i></i></span>NEW LOOK</div>
    <h1>Every feature.<br /><span>One menu.</span></h1>
    <ul class="points">
      <li>17 features, grouped in one clean menu</li>
      <li>Network, Stocks, Tools and Aeon</li>
      <li>A clear page, nothing in the way</li>
      <li>Built for desktop and phone</li>
    </ul>
  </div>
  <div class="url"><b>getaeon.network</b><i>→ tap ☰</i></div>

  <div class="desk">
    <div class="chrome"><em></em><em></em><em></em><span>getaeon.network</span></div>
    <img id="desk" alt="" />
  </div>
  <div class="phone"><img id="phone" alt="" /></div>
</div>
<script>
  let n = 0;
  const done = () => ++n === 2 && document.fonts.ready.then(() => (window.__ready = true));
  for (const [id, src] of [['desk', window.DESK], ['phone', window.PHONE]]) { const el = document.getElementById(id); el.onload = done; el.src = src; }
</script>
</body>
</html>
