<!doctype html>
<!-- Link-preview images (Open Graph, 1200x630). ?p=<page>. window.SHOT = a real crop of
     that page on the live site. Rendered into public/img/og/<page>.png. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@500;700;800;900&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet" />
<style>
  :root { --ink: #fafafa; --ink-2: #a3a3a3; --ink-3: #6b6b6b; --line: rgba(255,255,255,0.14); --line-strong: rgba(255,255,255,0.34); }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #000; color: var(--ink); font-family: Geist, sans-serif; -webkit-font-smoothing: antialiased; }
  .f { position: relative; width: 1200px; height: 630px; overflow: hidden; background: radial-gradient(70% 90% at 80% 50%, #161616 0%, #050505 60%, #000 100%); }
  .ticks::before, .ticks::after { content: ''; position: absolute; width: 18px; height: 18px; border: 0 solid var(--ink); z-index: 5; }
  .ticks::before { left: 24px; top: 24px; border-top-width: 3px; border-left-width: 3px; }
  .ticks::after { right: 24px; bottom: 24px; border-bottom-width: 3px; border-right-width: 3px; }
  .brand { position: absolute; left: 60px; top: 56px; display: flex; align-items: center; gap: 10px; font: 600 14px 'Geist Mono', monospace; letter-spacing: 0.2em; }
  .brand span { color: var(--ink-3); }
  .brand svg { width: 26px; height: 23px; }
  .tag { position: absolute; left: 60px; top: 118px; font: 600 13px 'Geist Mono', monospace; letter-spacing: 0.18em; background: var(--ink); color: #000; padding: 6px 10px; }
  h1 { position: absolute; left: 60px; top: 168px; width: 470px; margin: 0; font-size: 70px; line-height: 0.94; font-weight: 800; letter-spacing: -0.05em; }
  h1 span { color: var(--ink-3); }
  p { position: absolute; left: 60px; top: 372px; width: 440px; margin: 0; font-size: 21px; line-height: 1.45; color: var(--ink-2); }
  .url { position: absolute; left: 60px; bottom: 56px; font: 600 17px 'Geist Mono', monospace; background: var(--ink); color: #000; padding: 8px 13px; }
  .win { position: absolute; left: 570px; top: 96px; width: 760px; height: 450px; border: 1px solid var(--line-strong); background: #0a0a0a; box-shadow: 0 30px 90px rgba(0,0,0,0.9); overflow: hidden; }
  .bar { height: 32px; display: flex; align-items: center; gap: 7px; padding: 0 12px; border-bottom: 1px solid var(--line); background: #111; }
  .bar i { width: 9px; height: 9px; border: 1px solid rgba(255,255,255,0.35); }
  .bar .u { margin-left: 22px; font: 500 12px 'Geist Mono', monospace; color: var(--ink-2); }
  .win img { display: block; width: 100%; height: calc(100% - 32px); object-fit: cover; object-position: 0 0; }
  .win::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,0) 70%, rgba(0,0,0,0.7)), linear-gradient(180deg, rgba(0,0,0,0) 70%, rgba(0,0,0,0.75)); }
</style>
</head>
<body>
<div class="f ticks">
  <div class="brand"><svg viewBox="96 106 208 188"><g fill="#fff"><polygon points="100,290 138,290 230,124 230,110 200,110"/><polygon points="158.3,185 286,185 286,215 141.7,215"/><rect x="200" y="110" width="100" height="30"/><rect x="214" y="110" width="30" height="180"/><rect x="214" y="260" width="86" height="30"/></g></svg>AEON <span>NETWORK</span></div>
  <div class="tag" id="tag"></div>
  <h1 id="h1"></h1>
  <p id="p"></p>
  <div class="url" id="url"></div>
  <div class="win"><div class="bar"><i></i><i></i><i></i><span class="u" id="u"></span></div><img id="img" /></div>
</div>
<script>
  const PAGES = {
    home: ['LIVE · ROBINHOOD CHAIN', 'Every block.<br><span>As it happens.</span>', 'The live hub for Robinhood Chain: network, tokenized stocks, whales and an AI that reads the chain.', 'getaeon.network', ''],
    whales: ['NEW · WHALE TRACKER', 'Follow the<br><span>whales.</span>', 'Every large buy and sell of tokenized stocks on Robinhood Chain, live.', 'getaeon.network/whales', '/whales'],
    portfolio: ['PORTFOLIO', 'Your stocks,<br><span>on-chain.</span>', 'Any wallet’s tokenized stocks, valued live. Today’s gain or loss, fakes flagged.', 'getaeon.network/portfolio', '/portfolio'],
    stocks: ['TOKENIZED STOCKS', 'Real stocks.<br><span>Verified.</span>', 'All ~200 official ERC-8056 stock tokens, and a check for copycats.', 'getaeon.network/stocks', '/stocks'],
    ai: ['AEON AI AGENT', 'It works<br><span>the chain.</span>', 'An agent that scans tokens, follows whales and opens wallets, and shows every step.', 'getaeon.network/ai', '/ai'],
    live: ['NEW · COMMAND CENTER', 'One screen.<br><span>All live.</span>', 'Stock tokens, the meme radar and the whales on one screen, read from Robinhood Chain.', 'getaeon.network/live', '/live'],
    dev: ['DEV CHECKER', 'Check<br><span>the dev.</span>', 'Every token a creator launched on Pons, how they did, and whether the dev sold, burned or hid their tokens.', 'getaeon.network/dev', '/dev'],
    radar: ['TOKEN RADAR', 'Every launch.<br><span>Graded live.</span>', 'Every new token on Pons: bonding progress, market cap, the creator behind it and a safety grade.', 'getaeon.network/radar', '/radar'],
    scan: ['TOKEN SAFETY SCANNER', 'Is it<br><span>safe?</span>', 'Any token on Robinhood Chain: admin powers, a live honeypot test, holder spread and liquidity.', 'getaeon.network/scan', '/scan'],
    pulse: ['NETWORK PULSE', 'The chain,<br><span>today.</span>', 'Activity, money, stocks and whales on Robinhood Chain, with the change since yesterday.', 'getaeon.network/pulse', '/pulse'],
    leaderboard: ['TOP HOLDERS', 'Who holds<br><span>the most.</span>', 'The 50 largest tokenized-stock portfolios on Robinhood Chain, ranked live.', 'getaeon.network/leaderboard', '/leaderboard'],
    changelog: ['WHAT’S NEW', 'Built in<br><span>public.</span>', 'Every Aeon release, newest first.', 'getaeon.network/changelog', '/changelog'],
  };
  const p = new URLSearchParams(location.search).get('p') || 'home';
  const [tag, h1, sub, url, path] = PAGES[p];
  document.getElementById('tag').textContent = tag;
  document.getElementById('h1').innerHTML = h1;
  document.getElementById('p').textContent = sub;
  document.getElementById('url').textContent = url;
  document.getElementById('u').textContent = 'getaeon.network' + path;
  const img = document.getElementById('img');
  img.onload = () => document.fonts.ready.then(() => (window.__ready = true));
  img.src = window.SHOT;
</script>
</body>
</html>
