<!doctype html>
<!-- "Dev buy, fully burned" transparency post, 1600x900. window.DATA = /api/aeon/token response. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@500;700;800;900&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root { --ink: #fafafa; --ink-2: #a3a3a3; --ink-3: #6b6b6b; --line: rgba(255,255,255,0.14); --line-strong: rgba(255,255,255,0.34); }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #000; color: var(--ink); font-family: Geist, sans-serif; -webkit-font-smoothing: antialiased; }
  .f { position: relative; width: 1600px; height: 900px; overflow: hidden; background: radial-gradient(60% 70% at 72% 50%, #171717 0%, #050505 60%, #000 100%); }
  .ticks::before, .ticks::after { content: ''; position: absolute; width: 20px; height: 20px; border: 0 solid var(--ink); z-index: 5; }
  .ticks::before { left: 28px; top: 28px; border-top-width: 3px; border-left-width: 3px; }
  .ticks::after { right: 28px; bottom: 28px; border-bottom-width: 3px; border-right-width: 3px; }
  .top { position: absolute; left: 70px; right: 70px; top: 60px; display: flex; justify-content: space-between; align-items: center; font: 600 15px 'Geist Mono', monospace; letter-spacing: 0.2em; }
  .brand { display: flex; align-items: center; gap: 11px; }
  .brand span { color: var(--ink-3); }
  .brand svg { width: 28px; height: 25px; }
  .tag { background: var(--ink); color: #000; padding: 7px 12px; }
  .copy { position: absolute; left: 70px; top: 150px; width: 640px; display: grid; gap: 22px; }
  h1 { margin: 0; font-size: 104px; line-height: 0.9; font-weight: 800; letter-spacing: -0.055em; }
  h1 span { color: var(--ink-3); }
  .lead { margin: 0; font-size: 23px; line-height: 1.5; color: var(--ink-2); }
  .zero { position: absolute; left: 70px; bottom: 150px; display: flex; border: 1px solid var(--line-strong); }
  .zero div { padding: 16px 24px; border-right: 1px solid var(--line); }
  .zero div:last-child { border-right: 0; }
  .zero span { display: block; font: 600 12px 'Geist Mono', monospace; letter-spacing: 0.14em; color: var(--ink-3); }
  .zero b { display: block; margin-top: 8px; font: 500 34px 'Geist Mono', monospace; }
  .url { position: absolute; left: 70px; bottom: 66px; font: 600 19px 'Geist Mono', monospace; background: var(--ink); color: #000; padding: 9px 15px; }
  .stamp { position: absolute; right: 70px; bottom: 66px; font: 500 13px 'Geist Mono', monospace; color: var(--ink-3); letter-spacing: 0.1em; }
  .flow { position: absolute; right: 70px; top: 150px; width: 760px; display: grid; gap: 0; }
  .step { position: relative; border: 1px solid var(--line-strong); background: rgba(6,6,6,0.92); padding: 22px 26px; display: grid; grid-template-columns: 1fr auto; gap: 6px 20px; align-items: center; }
  .step .k { font: 600 13px 'Geist Mono', monospace; letter-spacing: 0.16em; color: var(--ink-3); grid-column: 1 / -1; }
  .step .w { font: 500 22px 'Geist Mono', monospace; }
  .step .v { font: 600 30px 'Geist Mono', monospace; text-align: right; }
  .step small { grid-column: 1 / -1; font: 400 14px 'Geist Mono', monospace; color: var(--ink-3); }
  .step.burn { border-color: var(--ink); box-shadow: 0 0 60px rgba(255,255,255,0.12); }
  .step.now .v { font-size: 46px; }
  .arrow { height: 46px; display: grid; place-items: center; font: 600 14px 'Geist Mono', monospace; color: var(--ink-3); letter-spacing: 0.16em; position: relative; }
  .arrow::before { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; border-left: 1px dashed var(--line-strong); }
  .arrow span { position: relative; background: #070707; padding: 2px 10px; }
</style>
</head>
<body>
<div class="f ticks">
  <div class="top">
    <div class="brand"><svg viewBox="96 106 208 188"><g fill="#fff"><polygon points="100,290 138,290 230,124 230,110 200,110"/><polygon points="158.3,185 286,185 286,215 141.7,215"/><rect x="200" y="110" width="100" height="30"/><rect x="214" y="110" width="30" height="180"/><rect x="214" y="260" width="86" height="30"/></g></svg>AEON <span>NETWORK</span></div>
    <div class="tag">TRANSPARENCY</div>
  </div>
  <div class="copy"><h1>Dev buy.<br /><span>Fully burned.</span></h1><p class="lead">At launch, the creator wallet bought AE and sent every token to the burn address in the same minute.</p></div>
  <div class="zero"><div><span>DEV WALLET HOLDS</span><b>0 AE</b></div><div><span>TEAM HOLDINGS</span><b>0.00%</b></div><div><span>BURNED BY DEV</span><b id="burned"></b></div></div>
  <div class="url">getaeon.network/#/ae</div>
  <div class="flow" id="flow"></div>
  <div class="stamp" id="stamp"></div>
</div>
<script>
  const D = window.DATA;
  const short = (a) => a.slice(0, 6) + '…' + a.slice(-4);
  const amt = window.AMOUNT;
  document.getElementById('burned').textContent = (amt / 1e6).toFixed(2) + 'M AE';
  document.getElementById('flow').innerHTML = `
    <div class="step"><div class="k">1 · DEV BUY AT LAUNCH</div><div class="w">${short(D.creator.address)}</div><div class="v">+${Math.round(amt).toLocaleString('en-US')}</div><small>from the Pons bonding curve · tx ${short(D.creator.buyTx)}</small></div>
    <div class="arrow"><span>SAME MINUTE</span></div>
    <div class="step burn"><div class="k">2 · SENT TO BURN ADDRESS</div><div class="w">0x0000…dEaD</div><div class="v">−${Math.round(amt).toLocaleString('en-US')}</div><small>gone for good · tx ${short(D.creator.burnTx)}</small></div>
    <div class="arrow"><span>TODAY</span></div>
    <div class="step now"><div class="k">3 · DEV WALLET BALANCE</div><div class="w">${short(D.creator.address)}</div><div class="v">${D.creator.balance} AE</div><small>read live from Robinhood Chain</small></div>`;
  document.getElementById('stamp').textContent = 'VERIFIED ON-CHAIN · ' + new Date().toISOString().slice(0, 16).replace('T', ' ') + ' UTC';
  document.fonts.ready.then(() => (window.__ready = true));
</script>
</body>
</html>
